services:
  spelunkr-plex:
    build: ./spelunkr_tuner
    container_name: spelunkr-plex
    restart: unless-stopped
    ports:
      - "5004:5004"
    environment:
      # Address Plex uses to reach this service. Set in .env for your machine.
      BASE_URL: ${BASE_URL:-http://192.168.68.85:5004}
      MODE: ${MODE:-copy}
